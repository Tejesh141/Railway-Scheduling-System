<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Navy background -->
  <rect width="32" height="32" rx="8" fill="#1A1A2E"/>
  <!-- Train body -->
  <rect x="7" y="10" width="18" height="11" rx="3" fill="#C9A84C"/>
  <!-- Windows -->
  <rect x="9.5" y="12.5" width="4" height="3.5" rx="1" fill="#1A1A2E"/>
  <rect x="15.5" y="12.5" width="4" height="3.5" rx="1" fill="#1A1A2E"/>
  <!-- Wheels -->
  <circle cx="11" cy="22" r="2.2" fill="#C9A84C" stroke="#1A1A2E" stroke-width="1"/>
  <circle cx="21" cy="22" r="2.2" fill="#C9A84C" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Track line -->
  <line x1="4" y1="24.5" x2="28" y2="24.5" stroke="#C9A84C" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
</svg>
